[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbt-standalone-mcp-server"
version = "0.1.0"
description = "Standalone prototype MCP server for Finnhub market data, VectorBT backtests, and Monte Carlo simulations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "vectorbt>=0.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools]
py-modules = ["server"]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
